[package]
name = "kb"
version = "0.1.0"
edition = "2021"
description = "Agent knowledge base CLI — JSONL event log + SQLite materialized cache with FTS5 and semantic search"

[features]
default = []
crash-sim = []

[[bin]]
name = "kb"
path = "src/bin/kb/main.rs"

[dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["fs", "std"] }
abscissa_core = "0.9"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
candle-core = { version = "0.9", default-features = false }
candle-nn = { version = "0.9", default-features = false }
candle-transformers = { version = "0.9", default-features = false }
fs2 = "0.4"
ureq = { version = "2", features = ["native-tls"] }
rusqlite = { version = "0.31", features = ["bundled", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse"] }
thiserror = "2"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
uuid = { version = "1", features = ["v4"] }
half = "2"
sha2 = "0.10"
crossbeam-channel = "0.5"
num_cpus = "1"
once_cell = "1"
regex = "1"
rand = "0.8"

[[bench]]
name = "verification"
harness = false

[[bench]]
name = "bench_kb_search_confidence"
harness = false

[[bench]]
name = "bench_search_vs_size"
harness = false

[[bench]]
name = "bench_interactive_surfaces"
harness = false

[dev-dependencies]
libc = "0.2"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.11.0"
tempfile = "3.27.0"

[[bin]]
name = "kb-bench-fixture"
path = "src/bin/kb-bench-fixture.rs"
