[package]
name = "kb"
version = "0.1.0"
edition = "2021"
description = "Agent knowledge base CLI — JSONL event log + SQLite materialized cache with FTS5 and semantic search"

[[bin]]
name = "kb"
path = "src/bin/kb/main.rs"

[dependencies]
abscissa_core = "0.9"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
candle-core = { version = "0.9", default-features = false }
candle-nn = { version = "0.9", default-features = false }
candle-transformers = { version = "0.9", default-features = false }
fs2 = "0.4"
ureq = { version = "2", features = ["native-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
