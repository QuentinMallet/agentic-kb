SPECIFICATION Spec

CONSTANTS
    EntryIds    = {"e1", "e2"}
    EvidenceIds = {"v1", "v2"}
    MaxLogLen   = 4

\* Bound the state space: only explore states with log length <= MaxLogLen.
CONSTRAINT LogLenBound

\* CompactionEquivalenceE is listed FIRST so that it — and not the Invariants
\* conjunction — is the violation TLC reports whenever compaction is the thing
\* that broke.  MUST PASS: CE1/CE2 (T1 retention arm + T2 emission rule), CE3
\* (legacy_add amendment), CE4 (DoLegacyAdd writer-producible-alphabet guard)
\* and CE5 (live-at-index retention bound) are all closed — see
\* T0-counterexample.md.
INVARIANT CompactionEquivalenceE
INVARIANT Invariants
INVARIANT PartitionEquivalent

\* Run: tlc AgentKbEvidence -config AgentKbEvidence.cfg -workers 4 -deadlock
