SPECIFICATION Spec

CONSTANTS
    EntryIds    = {"e1", "e2"}
    EvidenceIds = {"v1", "v2"}
    MaxLogLen   = 4

\* Bound the state space: only explore states with log length <= MaxLogLen.
CONSTRAINT LogLenBound

\* CompactionEquivalenceE is listed FIRST so that it — and not the Invariants
\* conjunction — is the violation TLC reports while the compaction defect is
\* still open.  EXPECTED TO FAIL until epic evidence-storage-integrity T1 and T2
\* land; see AgentKbEvidence_CE1.cfg / _CE2.cfg for the isolated counterexamples
\* and AgentKbEvidence_NoCompact.cfg for the regression run that must pass now.
INVARIANT CompactionEquivalenceE
INVARIANT Invariants
INVARIANT PartitionEquivalent

\* Run: tlc AgentKbEvidence -config AgentKbEvidence.cfg -workers 4 -deadlock
