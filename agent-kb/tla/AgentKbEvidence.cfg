SPECIFICATION Spec

CONSTANTS
    EntryIds    = {"e1", "e2"}
    EvidenceIds = {"v1", "v2"}
    MaxLogLen   = 4

\* Bound the state space: only explore states with log length <= MaxLogLen.
CONSTRAINT LogLenBound

\* Safety invariants — all hold over the reachable state space.
INVARIANT Invariants
INVARIANT PartitionEquivalent
INVARIANT CompactionEquivalenceE

\* Run: tlc AgentKbEvidence -config AgentKbEvidence.cfg -workers 4 -deadlock
