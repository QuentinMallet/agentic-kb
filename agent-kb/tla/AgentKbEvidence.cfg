\* conjunction — is the violation TLC reports whenever compaction is the thing
\* that broke.  T1/T2 and the CE3 legacy_add amendment closed CE1, CE2 and CE3;
\* this run is currently OPEN on CE4 (legacy upsert trailing an explicit-kind
\* upsert) and CE5 (post-expire evidence_add revived by compaction) — see
\* T0-counterexample.md.
INVARIANT CompactionEquivalenceE
INVARIANT Invariants
INVARIANT PartitionEquivalent

