\* CE1 — PRIMARY COUNTEREXAMPLE: compaction reorders an evidence_add ahead of
\* the retained upsert, and replay into a fresh database orphans it.
\*
\* Action set restricted to add / evidence_add / compact (SpecCE1) with a single
\* entry id and a single evidence id, so the shortest violating trace is unique:
\*
\*     add(e1, belief) · evidence_add(e1, v1) · add(e1, belief) · compact
\*
\* and the violated state has evidence[e1] = {} in MaterializeE(log) against
\* {v1} in the live database.  Exactly 4 events — zero headroom at MaxLogLen = 4.
\*
\* Retained as a NAMED REGRESSION GATE.  It failed against the pre-T1/T2
\* CompactedLogE; against the implemented one it MUST PASS.  A failure here is a
\* regression in the compaction emission rule.

SPECIFICATION SpecCE1

CONSTANTS
    EntryIds    = {"e1"}
    EvidenceIds = {"v1"}
    MaxLogLen   = 4

CONSTRAINT LogLenBound

INVARIANT CompactionEquivalenceE

\* Run: tlc AgentKbEvidence -config AgentKbEvidence_CE1.cfg -workers 4 -deadlock
