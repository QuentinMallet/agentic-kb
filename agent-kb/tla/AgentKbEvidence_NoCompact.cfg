\* consistent — TypeInvariantE, StatusConsistent, AddIgnoresClaimedStatus,
\* AbsentEntriesClean, OrphanAddIsSoftMandate, OrphanTolerated,
\* EvidenceKindRestricted and PartitionEquivalent all hold — independently of
\* the known compaction defect that CE1/CE2 exhibit.
