\* Main cfg. Premise check present; every invariant must be green.
\* Bounds: MaxRows = 1, MaxCandidates = 2, MaxPaths = 2.  Every invariant and
\* every action of this module is per-row: no action reads or writes a row
\* other than the one it names, and every invariant is a per-row conjunct or a
\* predicate over lastAction, which names one row.  One row is therefore
\* complete coverage of the race; CitationRelocation_Rows2.cfg re-checks that
\* claim with two rows.
INIT Init
NEXT Next

INVARIANT TypeOK
INVARIANT NoHealOnVerified
INVARIANT NoStaleHealCommit
INVARIANT VerifiedImpliesHashMatch
INVARIANT StoredHashImmutable
INVARIANT NoSilentPromotion
INVARIANT Monotonicity
INVARIANT NonUniqueUnverified
INVARIANT WeakExcerptUnverified

CONSTANTS
MaxRows = 1
MaxCandidates = 2
MaxPaths = 2
UnsafeApply = FALSE
