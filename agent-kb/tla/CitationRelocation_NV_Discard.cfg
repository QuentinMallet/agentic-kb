\* Non-vacuity probe for the main cfg.  Same bounds and same UnsafeApply = FALSE
\* as CitationRelocation.cfg, but the ONLY invariant is the probe, which TLC
\* must report VIOLATED: that violation is the proof that a stale plan really
\* does reach ApplyHeal and really is discarded, so NoStaleHealCommit is not
\* vacuously true in the main cfg.
INIT Init
NEXT Next

INVARIANT NoStalePlanEverDiscarded

CONSTANTS
MaxRows = 1
MaxCandidates = 2
MaxPaths = 2
UnsafeApply = FALSE
