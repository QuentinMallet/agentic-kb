\* Bound robustness on the path dimension: three distinct paths, so a plan may
\* target a path different from both the premise path and the concurrent move
\* destination (the literal A -> B / A -> C shape).
INIT Init
NEXT Next

INVARIANT TypeOK
INVARIANT NoHealOnVerified
INVARIANT NoStaleHealCommit
INVARIANT VerifiedImpliesHashMatch
INVARIANT StoredHashImmutable
INVARIANT NoSilentPromotion
INVARIANT Monotonicity
INVARIANT NonUniqueUnverified
INVARIANT WeakExcerptUnverified

CONSTANTS
MaxRows = 1
MaxCandidates = 2
MaxPaths = 3
UnsafeApply = FALSE
