\* Non-vacuity cfg, matched bounds to the main cfg.  UnsafeApply = TRUE drops
\* ONLY the path premise check in ApplyHeal, modelling heal_relocations
\* requerying citation_hash under the lock and never citation_path.  Every
\* invariant of the main cfg is listed; only NoStaleHealCommit may fail.
INIT Init
NEXT Next

INVARIANT TypeOK
INVARIANT NoHealOnVerified
INVARIANT NoStaleHealCommit
INVARIANT VerifiedImpliesHashMatch
INVARIANT StoredHashImmutable
INVARIANT NoSilentPromotion
INVARIANT Monotonicity
INVARIANT NonUniqueUnverified
INVARIANT WeakExcerptUnverified

CONSTANTS
MaxRows = 1
MaxCandidates = 2
MaxPaths = 2
UnsafeApply = TRUE
UnsafeVerdict = FALSE
