\* Models the fuller under-lock omission: path, content and verdict are not
\* rechecked before commit. Expected: NoStaleHealCommit and verdict-sensitive
\* invariants such as NonUniqueUnverified and/or WeakExcerptUnverified violate.
INIT Init
NEXT Next

INVARIANT TypeOK
INVARIANT NoHealOnVerified
INVARIANT NoStaleHealCommit
INVARIANT VerifiedImpliesHashMatch
INVARIANT StoredHashImmutable
INVARIANT NoSilentPromotion
INVARIANT Monotonicity
INVARIANT NonUniqueUnverified
INVARIANT WeakExcerptUnverified

CONSTANTS
MaxRows = 1
MaxCandidates = 2
MaxPaths = 2
UnsafeApply = TRUE
UnsafeVerdict = TRUE
