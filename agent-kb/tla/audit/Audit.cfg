SPECIFICATION Spec

CONSTANTS
    EntryIds   = {"e1", "e2", "e3"}
    KindVals   = {"code", "derived"}
    SessionIds = {"s1"}
    MaxAudits  = 2

\* Bound per-key audit counts to keep TLC state space finite.
CONSTRAINT AuditCountBound

\* Four named invariants from the Phase 5 plan.
INVARIANT TypeInvariant
INVARIANT EntryMonotonicity
INVARIANT ConfidenceInUnitInterval
INVARIANT ProvenanceAcyclicity
INVARIANT SourceWeightsAppendOnly

\* Run: tlc Audit -config Audit.cfg -workers 4 -deadlock
\* -deadlock required: entries reaching "stale" with MaxAudits hit are valid
\* terminal states (no further audit actions enabled for that entry/key).
