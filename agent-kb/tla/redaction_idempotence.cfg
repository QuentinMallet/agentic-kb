SPECIFICATION Spec

\* TokenVals must not contain REDACTED_TOKEN ("REDACTED") — the spec ASSUMEs
\* Secrets ⊆ TokenVals, and REDACTED_TOKEN is defined as a literal outside
\* TokenVals.  Keep this set small; state space = O(|TokenVals|^MaxLen).
CONSTANTS
    TokenVals = {"tok_a", "tok_b", "secret1", "secret2"}
    Secrets   = {"secret1", "secret2"}
    MaxLen    = 3

INVARIANT Invariants

\* No liveness property: the system is purely functional (Next = UNCHANGED).
\* -deadlock suppresses the "no next state" warning for terminal states.
\* Run: tlc redaction_idempotence -config redaction_idempotence.cfg -workers auto -deadlock
