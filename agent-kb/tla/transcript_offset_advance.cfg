SPECIFICATION Spec

CONSTANTS
    TurnIds     = {"t1", "t2", "t3"}
    MaxFileLen  = 3
    MaxInflight = 1

INVARIANT Invariants

\* Temporal safety: offset never decreases across any step.
PROPERTY OffsetNeverDecreases

\* Liveness: in-flight queue drains eventually.
\* Uses LiveSpec (WF_vars(Next)) — uncomment and switch SPECIFICATION to
\* LiveSpec when checking liveness (slower; safety check uses plain Spec).
\* SPECIFICATION LiveSpec
\* PROPERTY InflightEventuallyEmpty

\* Run (safety only):
\*   tlc transcript_offset_advance -config transcript_offset_advance.cfg -workers auto
\* Run (with liveness — switch SPECIFICATION to LiveSpec first):
\*   tlc transcript_offset_advance -config transcript_offset_advance.cfg -workers auto
