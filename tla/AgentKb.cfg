SPECIFICATION Spec

CONSTANTS
    Procs    = {"p1", "p2"}
    EntryIds = {"e1", "e2"}
    DataVals = {"d1"}
    MaxLogLen = 3

\* Bound the state space: only explore states with log length <= MaxLogLen.
\* Without this, the log grows without bound and TLC never terminates.
CONSTRAINT LogLenBound

INVARIANT Invariants

\* Liveness properties — use LiveSpec and uncomment when needed (slow):
\* SPECIFICATION LiveSpec
\* PROPERTY WriteEventuallyCompletes
\* PROPERTY RebuildEventuallyCompletes

\* Run: tlc AgentKb -config AgentKb.cfg -workers 4 -deadlock
\* -deadlock required: idle processes are valid terminal states.
