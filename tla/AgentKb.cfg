SPECIFICATION Spec

CONSTANTS
    Procs    = {"p1", "p2"}
    EntryIds = {"e1", "e2"}
    DataVals = {"d1"}

INVARIANT Invariants

\* Liveness properties (optional, slower to check):
\* PROPERTY WriteEventuallyCompletes
\* PROPERTY RebuildEventuallyCompletes

\* Run: tlc AgentKb -config AgentKb.cfg -workers 4 -deadlock
\* -deadlock is required: idle processes with empty pending queues are
\* intentional terminal states, not actual deadlocks.
